<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAt-H3QXKxrRtHo2ym-QvHMA5K5wWg9r3w",
      authDomain: "jameasaifiyahportal.firebaseapp.com",
      projectId: "jameasaifiyahportal",
      storageBucket: "jameasaifiyahportal.firebasestorage.app",
      messagingSenderId: "78639666781",
      appId: "1:78639666781:web:8ce9eaf25113c891765fb4",
      measurementId: "G-7KKGE2P58L"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>
</head>
<body class="p-6 bg-gray-100 font-sans">

  <h1 class="text-2xl font-bold mb-6 text-center">🎓 Student Videos</h1>

  <!-- 🔽 STEP 3 CODE GOES HERE -->
  <div id="videosContainer" class="space-y-6"></div>

  <script>
    db.collection("videos").orderBy("timestamp", "desc").onSnapshot(snapshot => {
      const container = document.getElementById("videosContainer");
      container.innerHTML = "";

      snapshot.forEach(doc => {
        const video = doc.data();
        const div = document.createElement("div");

        div.innerHTML = `
          <div class="border rounded-lg p-4 shadow-md bg-white">
            <h3 class="font-bold text-lg mb-2">${video.title}</h3>
            <p class="text-sm text-gray-500 mb-2">📅 ${video.date}</p>
            <iframe src="${video.link}" width="100%" height="400"
              allow="autoplay"
              frameborder="0"
              allowfullscreen
              oncontextmenu="return false;"
              style="pointer-events: auto;">
            </iframe>
          </div>
        `;

        container.appendChild(div);
      });
    });
  </script>

  <!-- 🔒 Disable right-click & download shortcuts -->
  <script>
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("keydown", e => {
      if (e.ctrlKey && (e.key === 's' || e.key === 'u' || e.key === 'p')) e.preventDefault();
    });
  </script>
</body>
</html>
