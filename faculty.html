<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎓 Student Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
      transition: background-image 1s ease-in-out;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.7);
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
    }

    header h1 {
      font-size: 1.5rem;
      margin: 0;
    }

    .btn {
      background-color: #2563eb;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      margin-left: 10px;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }

    .video-item {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .video-info {
      flex: 1;
      min-width: 250px;
      margin-right: 15px;
    }

    .video-info h3 {
      margin: 5px 0;
      font-size: 1.2rem;
    }

    .video-info p {
      color: #ccc;
      font-size: 0.9rem;
    }

    .video-actions a {
      background-color: #22c55e;
      padding: 8px 12px;
      border-radius: 6px;
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    .video-actions a:hover {
      background-color: #16a34a;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <header>
    <h1>🎓 Student Dashboard</h1>
    <div>
      <a href="index.html" class="btn">🏠 Home</a>
      <a href="index.html" class="btn">🚪 Logout</a>
    </div>
  </header>

  <main class="p-6" style="padding: 20px;">
    <div id="videosContainer"></div>
  </main>

  <!-- Firebase Config -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAt-H3QXKxrRtHo2ym-QvHMA5K5wWg9r3w",
      authDomain: "jameasaifiyahportal.firebaseapp.com",
      projectId: "jameasaifiyahportal",
      storageBucket: "jameasaifiyahportal.firebasestorage.app",
      messagingSenderId: "78639666781",
      appId: "1:78639666781:web:8ce9eaf25113c891765fb4",
      measurementId: "G-7KKGE2P58L"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

  <!-- 🔄 Background Slideshow -->
  <script>
    const images = [
      "https://images.unsplash.com/photo-1503676260728-1c00da094a0b",
      "https://images.unsplash.com/photo-1523050854058-8df90110c9f1",
      "https://images.unsplash.com/photo-1522202176988-66273c2fd55f",
      "https://images.unsplash.com/photo-1519389950473-47ba0277781c"
    ];
    let index = 0;
    function changeBackground() {
      document.body.style.backgroundImage = `url('${images[index]}')`;
      index = (index + 1) % images.length;
    }
    changeBackground();
    setInterval(changeBackground, 7000);
  </script>

  <!-- 🧠 Load Videos Horizontally -->
  <script>
    db.collection("videos").orderBy("timestamp", "desc").onSnapshot(snapshot => {
      const container = document.getElementById("videosContainer");
      container.innerHTML = "";

      snapshot.forEach(doc => {
        const video = doc.data();

        const div = document.createElement("div");
        div.classList.add("video-item");

        div.innerHTML = `
          <div class="video-info">
            <p>📅 ${video.date}</p>
            <h3>${video.title}</h3>
          </div>
          <div class="video-actions">
            <a href="${video.link}" target="_blank">▶️ Watch Video</a>
          </div>
        `;

        container.appendChild(div);
      });
    });
  </script>

  <!-- 🔒 Disable Right-Click & Download -->
  <script>
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("keydown", e => {
      if (e.ctrlKey && (e.key === 's' || e.key === 'u' || e.key === 'p')) e.preventDefault();
    });
  </script>
</body>
</html>
