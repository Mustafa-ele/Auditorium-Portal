<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Login - Admin / User</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    body { font-family: Arial, sans-serif; display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f5f7fb; }
    .card{background:#fff;padding:24px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.08);width:360px}
    input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:6px}
    button{width:100%;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer}
    p.msg{color:#d00}
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 12px 0;">Portal Login</h2>
    <input id="email" placeholder="Enter email" type="email" />
    <input id="password" placeholder="Enter password" type="password" />
    <button id="loginBtn">Login</button>
    <p class="msg" id="msg"></p>
    <p style="font-size:13px;color:#666;margin-top:8px">Only @jameasafiyah.edu accounts allowed.</p>
  </div>

  <script>
    // ---------- Firebase config ----------
    const firebaseConfig = {
      apiKey: "AIzaSyAt-H3QXKxrRtHo2ym-QvHMA5K5wWg9r3w",
      authDomain: "jameasaifiyahportal.firebaseapp.com",
      projectId: "jameasaifiyahportal",
      storageBucket: "jameasaifiyahportal.firebasestorage.app",
      messagingSenderId: "78639666781",
      appId: "1:78639666781:web:8ce9eaf25113c891765fb4",
      measurementId: "G-7KKGE2P58L"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const loginBtn = document.getElementById('loginBtn');
    const msg = document.getElementById('msg');

    loginBtn.addEventListener('click', async () => {
      msg.textContent = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) { msg.textContent = 'Please enter email and password.'; return; }
      if (!email.endsWith('@jameasafiyah.edu')) { msg.textContent = 'Only @jameasafiyah.edu emails allowed.'; return; }

      try {
        const userCred = await auth.signInWithEmailAndPassword(email, password);
        const adminEmail = 'admin@jameasafiyah.edu'; // <<== apna admin email likho yahan
        if (email.toLowerCase() === adminEmail.toLowerCase()) {
          // Admin login
          localStorage.setItem('email', email);
          localStorage.setItem('role', 'admin');
          window.location.href = 'admin.html';
        } else {
          // Normal user
          localStorage.setItem('email', email);
          localStorage.setItem('role', 'student');
          window.location.href = 'videos.html';
        }
      } catch (err) {
        console.error(err);
        msg.textContent = 'Login failed: ' + err.message;
      }
    });
  </script>
</body>
</html>
