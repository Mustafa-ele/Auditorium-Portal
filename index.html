<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Auditorium Portal</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(to bottom right, #eef2ff, #f8fafc);
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 50px;
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 500;
      color: #444;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 240px;
    }

    .btn {
      background: white;
      border: 1px solid #ccc;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover {
      background-color: #2563eb;
      color: white;
      border-color: #2563eb;
      transform: translateY(-2px);
    }

    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.85rem;
      color: #666;
    }

    /* optional background image changer */
    .bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-size: cover;
      background-position: center;
      transition: background-image 1s ease-in-out;
      opacity: 0.15;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <h1>Welcome to Auditorium Portal</h1>
  <!-- <h2>Centre for Learning and Online Access</h2> -->

  <div class="buttons">
    <button class="btn">🎓 Login as Student</button>
    <button class="btn">👨‍🏫 Login as Faculty</button>
    <button class="btn" onclick="window.location.href='login.html'">🛠️ Login as Admin</button>
  </div>

  <footer>© 2025 Auditorium Portal | Powered by Jameasafiyah</footer>

  <script>
    // Optional: Background images that change every 8 seconds
    const bg = document.querySelector('.bg');
    const images = [
      "https://images.unsplash.com/photo-1523050854058-8df90110c9f1",
      "https://images.unsplash.com/photo-1519389950473-47ba0277781c",
      "https://images.unsplash.com/photo-1503676260728-1c00da094a0b",
      "https://images.unsplash.com/photo-1522202176988-66273c2fd55f"
    ];
    let index = 0;
    function changeBG() {
      bg.style.backgroundImage = `url('${images[index]}')`;
      index = (index + 1) % images.length;
    }
    changeBG();
    setInterval(changeBG, 8000);
  </script>
</body>
</html>
