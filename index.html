<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jameasafiyah Learning Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: "Poppins", sans-serif;
      transition: background-image 1s ease-in-out;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    .buttons button {
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      border: none;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .buttons button:hover {
      background: #2563eb;
      color: white;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="container">
    <h1>Welcome to Jameasafiyah Learning Portal</h1>
    <div class="buttons">
      <button>Student</button>
      <button>Faculty</button>
      <button onclick="window.location.href='login.html'">Admin</button>
    </div>
  </div>

  <script>
    // Background image list
    const images = [
      "https://images.unsplash.com/photo-1523050854058-8df90110c9f1",
      "https://images.unsplash.com/photo-1519389950473-47ba0277781c",
      "https://images.unsplash.com/photo-1503676260728-1c00da094a0b",
      "https://images.unsplash.com/photo-1522202176988-66273c2fd55f"
    ];

    let index = 0;

    function changeBackground() {
      document.body.style.backgroundImage = `url('${images[index]}')`;
      index = (index + 1) % images.length;
    }

    changeBackground(); // first background
    setInterval(changeBackground, 7000); // change every 7 seconds
  </script>
</body>
</html>
