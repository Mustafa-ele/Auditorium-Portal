<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jameasafiyah Learning Portal</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(to bottom right, #6a11cb, #2575fc);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 20px;
    }

    button {
      background: white;
      color: #2575fc;
      border: none;
      padding: 15px 30px;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #2575fc;
      color: white;
    }

    /* Login Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      color: black;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 300px;
      position: relative;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      cursor: pointer;
      font-size: 20px;
    }

    input {
      width: 90%;
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .login-btn {
      background: #2575fc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #1a5fd2;
    }
  </style>
</head>
<body>
  <h1>Welcome to Jameasafiyah Learning Portal</h1>

  <div class="buttons">
    <button onclick="openLogin('student')">Student</button>
    <button onclick="openLogin('faculty')">Faculty</button>
    <button onclick="openLogin('admin')">Admin</button>
  </div>

  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="roleTitle"></h2>
      <input type="email" id="email" placeholder="Enter your email" />
      <input type="password" id="password" placeholder="Enter password" />
      <button class="login-btn" onclick="login()">Login</button>
      <p id="error" style="color: red;"></p>
    </div>
  </div>

  <script>
    let selectedRole = "";

    function openLogin(role) {
      selectedRole = role;
      document.getElementById("roleTitle").textContent =
        role.charAt(0).toUpperCase() + role.slice(1) + " Login";
      document.getElementById("loginModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("loginModal").style.display = "none";
      document.getElementById("error").textContent = "";
    }

    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const error = document.getElementById("error");

      if (!email.endsWith("@jameasafiyah.edu") && selectedRole !== "admin") {
        error.textContent = "Access denied! Only @jameasafiyah.edu allowed.";
        return;
      }

      if (!email || !password) {
        error.textContent = "Please enter both email and password.";
        return;
      }

      // Redirect simulation
      if (selectedRole === "admin") {
        alert("Welcome Admin! Redirecting to video upload page...");
        window.location.href = "admin.html";
      } else {
        alert("Welcome " + selectedRole + "! Redirecting to video page...");
        window.location.href = "videos.html";
      }
    }
  </script>
</body>
</html>
