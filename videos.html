<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recorded Videos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #141E30, #243B55);
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .video-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      margin: 15px auto;
      width: 80%;
      max-width: 800px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .video-details {
      text-align: left;
      flex: 1;
    }

    iframe {
      width: 300px;
      height: 180px;
      border-radius: 10px;
      border: none;
      pointer-events: none; /* Disable click = prevent full screen */
    }

    button {
      background: #ff4b2b;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #ff1c00;
    }

    .top-buttons {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .top-buttons button {
      background: #0066ff;
      padding: 10px 18px;
    }

    .top-buttons button:hover {
      background: #004ecb;
    }

  </style>
</head>
<body>

  <div class="top-buttons">
    <button onclick="window.location.href='home.html'">🏠 Home</button>
    <button onclick="logout()">🚪 Logout</button>
  </div>

  <h1>📚 Recorded Videos</h1>

  <div id="videosList"></div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAt-H3QXKxrRtHo2ym-QvHMA5K5wWg9r3w",
      authDomain: "jameasaifiyahportal.firebaseapp.com",
      projectId: "jameasaifiyahportal",
      storageBucket: "jameasaifiyahportal.firebasestorage.app",
      messagingSenderId: "78639666781",
      appId: "1:78639666781:web:8ce9eaf25113c891765fb4",
      measurementId: "G-7KKGE2P58L"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 🔹 Fetch videos
    const videosList = document.getElementById("videosList");

    db.collection("videos").onSnapshot(snapshot => {
      videosList.innerHTML = "";
      snapshot.forEach(doc => {
        const data = doc.data();
        const card = document.createElement("div");
        card.classList.add("video-card");

        card.innerHTML = `
          <div class="video-details">
            <h3>${data.fileName}</h3>
            <p>📅 ${data.date}</p>
            <a href="${data.link}" target="_blank" style="color:#00c3ff;">🎥 Watch Video</a>
          </div>
          <iframe src="${data.link.replace('/view', '/preview')}"></iframe>
          ${isAdmin() ? `<button onclick="deleteVideo('${doc.id}')">🗑 Delete</button>` : ""}
        `;

        videosList.appendChild(card);
      });
    });

    // 🔹 Check if user is admin
    function isAdmin() {
      const email = localStorage.getItem("email") || "";
      return email.endsWith("@jameasafiyah.edu");
    }

    // 🔹 Delete video
    function deleteVideo(id) {
      if (confirm("Are you sure you want to delete this video?")) {
        db.collection("videos").doc(id).delete().then(() => {
          alert("Video deleted successfully!");
        });
      }
    }

    // 🔹 Logout
    function logout() {
      localStorage.removeItem("email");
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
