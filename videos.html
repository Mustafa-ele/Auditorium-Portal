<!DOCTYPE html>
<html>
<head>
  <title>Videos Page</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
</head>
<body style="font-family:sans-serif;">
  <h2 style="text-align:center;">Recorded Videos</h2>
  <div id="videosContainer" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:20px;"></div>

  <script>
    async function loadVideos() {
      const container = document.getElementById('videosContainer');
      const snapshot = await db.collection("videos").orderBy("timestamp", "desc").get();
      snapshot.forEach(doc => {
        const data = doc.data();
        const iframe = document.createElement("iframe");
        iframe.src = data.link;
        iframe.width = "100%";
        iframe.height = "250";
        iframe.allow = "autoplay";
        iframe.style.border = "none";

        // Wrap in a div to hide download button clicks
        const div = document.createElement("div");
        div.style.position = "relative";
        div.style.overflow = "hidden";
        div.style.borderRadius = "10px";
        div.appendChild(iframe);
        container.appendChild(div);
      });
    }

    loadVideos();
  </script>
</body>
</html>
