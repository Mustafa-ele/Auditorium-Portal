<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recorded Videos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #222;
    }

    .top-buttons {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .top-buttons button {
      background: #0066ff;
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .top-buttons button:hover {
      background: #004ecb;
    }

    .video-row {
      background: white;
      padding: 12px 15px;
      margin: 8px auto;
      border-radius: 8px;
      width: 90%;
      max-width: 800px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .video-info {
      flex: 1;
      text-align: left;
    }

    .video-info span {
      display: inline-block;
      width: 120px;
      font-weight: bold;
    }

    .video-link {
      color: #0066ff;
      text-decoration: none;
      font-weight: bold;
      margin-left: 10px;
    }

    .video-link:hover {
      text-decoration: underline;
    }

    .delete-btn {
      background: #ff4b2b;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #ff1c00;
    }
  </style>
</head>
<body>

  <div class="top-buttons">
    <button onclick="window.location.href='home.html'">🏠 Home</button>
    <button onclick="logout()">🚪 Logout</button>
  </div>

  <h1>📚 Recorded Videos</h1>

  <div id="videosList"></div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    // 🔹 Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAt-H3QXKxrRtHo2ym-QvHMA5K5wWg9r3w",
      authDomain: "jameasaifiyahportal.firebaseapp.com",
      projectId: "jameasaifiyahportal",
      storageBucket: "jameasaifiyahportal.firebasestorage.app",
      messagingSenderId: "78639666781",
      appId: "1:78639666781:web:8ce9eaf25113c891765fb4",
      measurementId: "G-7KKGE2P58L"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const videosList = document.getElementById("videosList");

    // 🔹 Fetch and display videos
    db.collection("videos").orderBy("date", "desc").onSnapshot(snapshot => {
      videosList.innerHTML = "";
      snapshot.forEach(doc => {
        const data = doc.data();
        const date = data.date || "No date";
        const fileName = data.fileName || data.title || "No title";
        const link = data.link || data.videoLink || "#";

        const div = document.createElement("div");
        div.classList.add("video-row");

        const videoHTML = `
          <div class="video-info">
            <span>📅 ${date}</span> 
            <span>🏷️ Title: ${fileName}</span> 
            <span>🔗 <a href="${link}" target="_blank" class="video-link">${link}</a></span>
          </div>
          ${isAdmin() ? `
            <div>
              <button class="delete-btn" onclick="deleteVideo('${doc.id}')">🗑</button>
              <button class="delete-btn" style="background:#ffa500" onclick="editVideo('${doc.id}', '${fileName}', '${link}')">✏️</button>
            </div>` 
          : ""}
        `;

        div.innerHTML = videoHTML;
        videosList.appendChild(div);
      });
    });

    // 🔹 Check if user is admin
    function isAdmin() {
      const email = localStorage.getItem("email") || "";
      return email.endsWith("@jameasafiyah.edu");
    }

    // 🔹 Delete video
    function deleteVideo(id) {
      if (confirm("Are you sure you want to delete this video?")) {
        db.collection("videos").doc(id).delete().then(() => {
          alert("Video deleted successfully!");
        });
      }
    }

    // 🔹 Edit video
    function editVideo(id, currentTitle, currentLink) {
      const newTitle = prompt("Enter new title:", currentTitle);
      const newLink = prompt("Enter new link:", currentLink);

      if (newTitle && newLink) {
        db.collection("videos").doc(id).update({
          fileName: newTitle,
          link: newLink
        }).then(() => {
          alert("Video details updated successfully!");
        });
      }
    }

    // 🔹 Logout
    function logout() {
      localStorage.removeItem("email");
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
